[package]
name = "milo-app"
version = "0.1.0"
description = "Milo desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "milo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
